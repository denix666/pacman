name: Build

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  linux_build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux build dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends build-essential pkg-config \
          libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
          libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libudev-dev
        # show that libasound was installed and available
        ls -l /usr/lib/x86_64-linux-gnu/libasound* || true
        ldconfig -p | grep asound || true

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: Build (verbose)
      run: |
        # -vv to show full linker command; helpful for debugging missing -l flags
        cargo build --release -vv

    - shell: bash
      run: |
        mv target/release/rusted-pacman rusted-pacman
        chmod 777 rusted-pacman
        tar cpfz rusted-pacman_linux_x86_64.tar.gz rusted-pacman

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: rusted-pacman_linux_x86_64.tar.gz

  win_build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release

    - name: Prepare artifact
      shell: pwsh
      run: |
        Move-Item target/release/rusted-pacman.exe rusted-pacman.exe
        Compress-Archive -Path rusted-pacman.exe -DestinationPath rusted-pacman_windows_x86_64.zip

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: rusted-pacman_windows_x86_64.zip
